<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add New Task</title>
    <link rel="stylesheet" th:href="@{/css/new-task.css}">
</head>

<body class="new-task-page">

    <h1 class="form-title">Create New Task</h1>

    <form class="task-form" th:action="@{/tasks}" th:object="${task}" method="post">

        <div class="form-group">
            <label>Title</label>
            <input type="text" th:field="*{title}" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea th:field="*{description}"></textarea>
        </div>

        <div class="form-group">
            <label>Due Date</label>
            <input type="date" th:field="*{dueDate}" required>
        </div>

        <div class="form-group">
            <label>Priority</label>

            <select th:field="*{priority}" required>
                <option value="">Choose Priority</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>
        </div>

        <button class="save-task-btn" type="submit">Save Task</button>

    </form>

    <a class="cancel-link" th:href="@{/}">Cancel</a>

</body>
</html>
