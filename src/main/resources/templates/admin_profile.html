
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Admin Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #263445;
        }

        /* Sidebar */
        .sidebar {
            width: 230px;
            height: 100vh;
            background: #17243a;
            color: white;
            position: fixed;
            padding: 25px 20px;
        }

        .sidebar h2 {
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 14px 10px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #30425d;
            color: white;
        }

        .sidebar a.active {
            background: #30425d;
            color: white;
        }

        /* Main */
        .main {
            margin-left: 230px;
            padding: 35px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .header span {
            color: #718096;
        }

        /* Profile Card */
        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            max-width: 650px;
            margin: 0 auto;
            text-align: center;
        }

        .profile-card img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e2e8f0;
            margin-bottom: 15px;
        }

        .profile-card h2 {
            margin-bottom: 8px;
        }

        .role {
            display: inline-block;
            background: #e8f1fc;
            color: #3985dc;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info-item {
            padding: 18px;
            border-bottom: 1px solid #edf0f5;
        }

        .info-item label {
            display: block;
            color: #718096;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .info-item p {
            margin: 0;
            font-weight: bold;
            color: #263445;
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .logout-btn {
            background: #d65a5a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #bd4545;
        }

        .back-link {
            display: inline-block;
            background: #3985dc;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 14px;
        }

        .back-link:hover {
            background: #286bb7;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 180px;
            }

            .main {
                margin-left: 180px;
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <h2>TaskFlow</h2>

    <a th:href="@{/admin/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/admin/users}">
        Users
    </a>

    <a th:href="@{/admin/profile}" class="active">
        Profile
    </a>

</div>

<div class="main">

    <div class="header">
        <h1>My Profile</h1>
        <span>Administrator</span>
    </div>

    <div class="profile-card">

       <img th:src="${admin.picture}"
         alt="Admin Picture"
         width="50"
         height="50"
         style="border-radius: 50%; object-fit: cover;"
         onload="console.log('Image loaded:', this.src)"
         onerror="console.log('Image failed:', this.src)">

        <h2 th:text="${admin.name}">Admin Name</h2>

        <span class="role">Administrator</span>

        <div class="info">

            <div class="info-item">
                <label>Full Name</label>
                <p th:text="${admin.name}">Admin Name</p>
            </div>

            <div class="info-item">
                <label>Email Address</label>
                <p th:text="${admin.email}">admin@email.com</p>
            </div>

        </div>

        <div class="buttons">

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">
                    Logout
                </button>
            </form>

            <a class="back-link"
               th:href="@{/admin/dashboard}">
                Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
