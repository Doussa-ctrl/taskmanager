
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Users - TaskFlow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            padding: 30px;
            color: #263445;
        }

        h1 {
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #17243a;
            color: white;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .disable {
            background: #dc5353;
        }

        .activate {
            background: #16a36a;
        }
        .delete {
    background: #333;
}
.actions {
    display: flex;
    align-items: center;
    gap: 8px;
}
        a {
            text-decoration: none;
            color: #3985dc;
        }
        .profile-img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #eee;
}

.no-image {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #dce3ed;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #263445;
    font-weight: bold;
}
    </style>
</head>

<body>

    <h1>Manage Users</h1>

    <a th:href="@{/admin/dashboard}">
        Back to Dashboard
    </a>

    <br><br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>picture</th>
                <th>Name</th>
                <th>Email</th>
                <th>created at</th>
                <th>Account Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="user : ${users}">

                <td th:text="${user.id}"></td>

   <td>
    <img th:src="${user.picture}"
         alt="User Picture"
         width="50"
         height="50"
         style="border-radius: 50%; object-fit: cover;"
         onload="console.log('Image loaded:', this.src)"
         onerror="console.log('Image failed:', this.src)">
</td>

                <td th:text="${user.name}"></td>

                <td th:text="${user.email}"></td>
                 <td th:text="${user.createdAt}"></td>
                <td>
                    <span th:if="${user.accountStatus == T(com.taskmanager.taskmanager.enums.AccountStatus).ACTIVE}"
                          class="active">
                        ACTIVE
                    </span>

                    <span th:if="${user.accountStatus == T(com.taskmanager.taskmanager.enums.AccountStatus).INACTIVE}"
                          class="inactive">
                        INACTIVE
                    </span>
                </td>

                <td>
    <div class="actions">

        <!-- Disable -->
        <form th:if="${user.accountStatus == T(com.taskmanager.taskmanager.enums.AccountStatus).ACTIVE}"
              th:action="@{/admin/users/{id}/disable(id=${user.id})}"
              method="post">

            <button type="submit" class="disable">
                Disable
            </button>
        </form>

        <!-- Activate -->
        <form th:if="${user.accountStatus == T(com.taskmanager.taskmanager.enums.AccountStatus).INACTIVE}"
              th:action="@{/admin/users/{id}/activate(id=${user.id})}"
              method="post">

            <button type="submit" class="activate">
                Activate
            </button>
        </form>

        <!-- Delete -->
        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
              method="post"
              onsubmit="return confirm('Are you sure you want to delete this user and all their tasks?');">

            <button type="submit" class="delete">
                Delete
            </button>
        </form>

    </div>
</td>
            </tr>
        </tbody>
    </table>


</body>
</html>
