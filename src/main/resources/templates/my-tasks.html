
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Tasks</title>
    <link rel="stylesheet" th:href="@{/css/tasks.css}">
</head>

<body class="tasks-page">

    <h1 class="tasks-title">My Tasks</h1>

    <a class="add-task-btn" th:href="@{/tasks/new}">Add New Task</a>
<hr>

<form class="filter-form" th:action="@{/tasks/filter}" method="get">

    <label>Filter by Priority:</label>

    <select name="priority">

        <option value="HIGH"
                th:selected="${selectedPriority == T(com.taskmanager.taskmanager.enums.Priority).HIGH}">
            High
        </option>

        <option value="MEDIUM"
                th:selected="${selectedPriority == T(com.taskmanager.taskmanager.enums.Priority).MEDIUM}">
            Medium
        </option>

        <option value="LOW"
                th:selected="${selectedPriority == T(com.taskmanager.taskmanager.enums.Priority).LOW}">
            Low
        </option>

    </select>

    <button type="submit">Filter</button>

    <a th:href="@{/tasks}">Clear Filter</a>

</form>

<hr>
    <hr>

    <div class="empty-message" th:if="${#lists.isEmpty(tasks)}">
        <p>You have no active tasks.</p>
    </div>

    <div class="task-card" th:each="task : ${tasks}">

        <h3 class="task-title" th:text="${task.title}"></h3>

        <p class="task-description" th:text="${task.description}"></p>

        <p class="task-detail">
            Priority:
            <span class="task-priority" th:text="${task.priority}"></span>
        </p>

        <p class="task-detail">
            Status:
            <span class="task-status" th:text="${task.status}"></span>
        </p>

        <p class="task-detail">
            Due Date:
            <span class="task-date" th:text="${task.dueDate}"></span>
        </p>

        <a class="edit-btn" th:href="@{/tasks/edit/{id}(id=${task.id})}">
            Edit
        </a>

        <form class="delete-form" th:action="@{/tasks/delete/{id}(id=${task.id})}"
      method="post"
      onsubmit="return confirm('Are you sure you want to delete this task?');">

    <button class="delete-btn" type="submit">Delete</button>

</form>

        <form class="status-form" th:action="@{/tasks/status/{id}(id=${task.id})}"
              method="post"
              style="display:inline;">

            <select name="status">
                <option value="TODO"
                        th:selected="${task.status.name() == 'TODO'}">
                    To Do
                </option>

                <option value="IN_PROGRESS"
                        th:selected="${task.status.name() == 'IN_PROGRESS'}">
                    In Progress
                </option>

                <option value="DONE">Completed</option>
            </select>

          
    <button class="status-btn" type="submit">Change Status</button>

</form>

        </form>

        <hr>

    </div>

    <a class="back-link" th:href="@{/}">Back to Dashboard</a>

</body>
</html>
